[tool.pytest.ini_options]
# Pytest configuration for Canvas MCP Client backend tests

minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Add project root to Python path
pythonpath = ["."]

# Async test configuration
asyncio_mode = "auto"

# Test discovery and execution options
addopts = -v --tb=short --strict-markers --disable-warnings --color=yes -p no:cacheprovider

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    mcp: marks tests related to MCP functionality
    database: marks tests related to database operations
    api: marks tests related to API endpoints

# Minimum test coverage thresholds (optional)
# These can be used with pytest-cov plugin
# addopts = ["--cov=.", "--cov-report=html", "--cov-report=term", "--cov-fail-under=80"]

# Test timeout (optional, requires pytest-timeout)
# timeout = 300  # 5 minutes

# Fixtures configuration
# Control fixture scope and cleanup
usefixtures = clean_test_data

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*using sqlite.*:sqlalchemy.exc.SAWarning

# Log configuration for tests
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Disable log capture during test runs to see real-time logs
log_capture = false
