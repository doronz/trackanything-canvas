name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const prTitle = context.payload.pull_request.title;

            // Define valid prefixes
            const validPrefixes = [
              'feat:', 'fix:', 'docs:', 'style:', 'refactor:',
              'perf:', 'test:', 'build:', 'ci:', 'chore:',
              'revert:', 'security:'
            ];

            // Check if title starts with a valid prefix
            const hasValidPrefix = validPrefixes.some(prefix =>
              prTitle.toLowerCase().startsWith(prefix)
            );

            if (!hasValidPrefix) {
              const errorMessage = `
              ❌ **PR Title Check Failed**

              Your PR title doesn't follow the conventional commit format.

              **Current title:** \`${prTitle}\`

              **Expected format:** \`<type>: <description>\`

              **Valid types:**
              - \`feat:\` - A new feature
              - \`fix:\` - A bug fix
              - \`docs:\` - Documentation changes
              - \`style:\` - Code style changes (formatting, etc.)
              - \`refactor:\` - Code refactoring
              - \`perf:\` - Performance improvements
              - \`test:\` - Test additions or updates
              - \`build:\` - Build system changes
              - \`ci:\` - CI/CD configuration changes
              - \`chore:\` - Maintenance tasks
              - \`revert:\` - Revert previous changes
              - \`security:\` - Security fixes

              **Examples:**
              - \`feat: add weather widget with forecast display\`
              - \`fix: resolve canvas zoom calculation issue\`
              - \`docs: update installation instructions\`

              **For breaking changes, add an exclamation mark:**
              - \`feat!: redesign widget API\`

              Please update your PR title to match this format.
              `;

              // Post comment on PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: errorMessage
              });

              // Fail the check
              core.setFailed('PR title does not follow conventional commit format');
            } else {
              console.log('✅ PR title follows conventional commit format');

              // Check for proper capitalization and format
              const titleParts = prTitle.split(':');
              if (titleParts.length < 2) {
                core.setFailed('PR title must have a colon followed by description');
              } else {
                const description = titleParts.slice(1).join(':').trim();
                if (!description) {
                  core.setFailed('PR title must have a description after the colon');
                } else if (description.length < 3) {
                  core.warning('PR title description is very short. Consider adding more detail.');
                }

                // Check if description starts with lowercase (recommended)
                if (description[0] !== description[0].toLowerCase()) {
                  core.notice('Consider starting the description with a lowercase letter (e.g., "feat: add feature" instead of "feat: Add feature")');
                }
              }
            }

      - name: Check for breaking changes indicator
        uses: actions/github-script@v7
        with:
          script: |
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || '';

            // Check if title has breaking change indicator but body doesn't mention it
            const hasBreakingInTitle = prTitle.includes('!:');
            const hasBreakingSection = prBody.toLowerCase().includes('breaking change');

            if (hasBreakingInTitle && !hasBreakingSection) {
              const warningMessage = `
              ⚠️ **Breaking Change Notice**

              Your PR title indicates a breaking change (\`!\`), but the PR description doesn't include a "Breaking Changes" section.

              Please add a section to your PR description explaining:
              - What is breaking
              - Why it's necessary
              - How users should migrate

              **Example:**
              \`\`\`markdown
              ## Breaking Changes

              - Widget API now requires \`config\` parameter
              - Migration: Update all widget calls to include \`config: {}\`
              \`\`\`
              `;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: warningMessage
              });

              core.warning('PR indicates breaking change but lacks documentation in description');
            }

